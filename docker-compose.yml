networks:
  media-network:
    driver: bridge

services:
  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_TAG}
    container_name: radarr
    networks:
      - media-network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${RADARR_CONFIG}:/config
      - ${MOVIES}:/movies
      - ${MEDIA}:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_TAG}
    container_name: sonarr
    networks:
      - media-network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${SONARR_CONFIG}:/config
      - ${TV}:/tv
      - ${MEDIA}:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:${SABNZB_TAG}
    container_name: sabnzbd
    networks:
      - media-network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${SABNZB_CONFIG}:/config
      - ${MEDIA}:/downloads
      - ${TEMP}:/incomplete-downloads
    ports:
      - 8080:8080
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:${JELLYFIN_TAG}
    container_name: jellyfin
    networks:
      - media-network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - ${JELLYFIN_CONFIG}:/config
      - ${TV}:/data/tvshows
      - ${MOVIES}:/data/movies
    ports:
      - 8096:8096
    restart: unless-stopped

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data

volumes:
  dockhand_data:
